<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c10">
<title>9 Contrarian Notions on the Law of Crimes in India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --panel:#111111;
  --panel2:#1a1a1a;
  --ink:#ffffff;
  --muted:#8a8a8a;
  --line:rgba(255,255,255,0.16);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overscroll-behavior:none;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  overscroll-behavior:none;
}
.deck{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  touch-action:pan-y;
}
.slide{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:6vh 6vw;
  padding:max(4vh, env(safe-area-inset-top)) max(6vw, env(safe-area-inset-right)) max(6vh, env(safe-area-inset-bottom)) max(6vw, env(safe-area-inset-left));
  text-align:center;
  animation:rise .6s ease both;
  overflow-y:auto;
}
@media (prefers-reduced-motion: reduce){
  .slide{animation:none;}
}
.slide.active{display:flex;}
@keyframes rise{
  from{opacity:0; transform:translateY(18px);}
  to{opacity:1; transform:translateY(0);}
}

/* ---------- Staggered entrance choreography for slide text ---------- */
@keyframes revealUp{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:translateY(0);}
}
.slide.active .eyebrow{animation:revealUp .5s cubic-bezier(.2,.7,.2,1) .04s both;}
.slide.active .title{animation:revealUp .6s cubic-bezier(.2,.7,.2,1) .13s both;}
.slide.active .sub{animation:revealUp .55s cubic-bezier(.2,.7,.2,1) .26s both;}
.slide.active .scene{animation:revealUp .6s cubic-bezier(.2,.7,.2,1) .34s both;}
.slide.active .takeaway{animation:revealUp .55s cubic-bezier(.2,.7,.2,1) .5s both;}

/* ---------- SVG figure & prop entrance (pop + settle) ---------- */
@keyframes popIn{
  0%{opacity:0; transform:translateY(14px) scale(.82);}
  70%{opacity:1; transform:translateY(-2px) scale(1.03);}
  100%{opacity:1; transform:translateY(0) scale(1);}
}
.enter{animation:popIn .6s cubic-bezier(.22,.9,.32,1.1) both;}

/* ---------- Idle / ambient loops — the "alive" layer ---------- */
@keyframes bob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}
.idle-bob{animation:bob 2.6s ease-in-out infinite;}
.idle-bob-slow{animation:bob 3.6s ease-in-out infinite;}

@keyframes shockBob{
  0%,100%{transform:translateY(0) rotate(0deg);}
  25%{transform:translateY(-3px) rotate(-2deg);}
  75%{transform:translateY(-1px) rotate(2deg);}
}
.idle-shock{animation:shockBob 1.1s ease-in-out infinite;}

@keyframes camScan{
  0%,100%{transform:rotate(-9deg);}
  50%{transform:rotate(9deg);}
}
.idle-scan{animation:camScan 3.4s ease-in-out infinite; transform-origin:0px 1px;}

@keyframes swing{
  0%,100%{transform:rotate(-6deg);}
  50%{transform:rotate(6deg);}
}
.idle-swing{animation:swing 2.8s ease-in-out infinite; transform-origin:0px 0px;}
.idle-swing-door{animation:swing 4.5s ease-in-out infinite; transform-origin:-24px 0px;}

@keyframes tilt{
  0%,100%{transform:rotate(-5deg);}
  50%{transform:rotate(5deg);}
}
.idle-tilt{animation:tilt 3.2s ease-in-out infinite; transform-origin:0px -30px;}

@keyframes shake{
  0%,100%{transform:rotate(0deg) translateX(0);}
  25%{transform:rotate(-3deg) translateX(-1px);}
  75%{transform:rotate(3deg) translateX(1px);}
}
.idle-shake{animation:shake .85s ease-in-out infinite;}

@keyframes tick{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
.idle-tick{animation:tick 14s linear infinite; transform-origin:0px 0px;}

@keyframes flicker{
  0%,100%{opacity:.9;}
  45%{opacity:.55;}
  55%{opacity:.85;}
}
.idle-flicker{animation:flicker 3.2s ease-in-out infinite;}

@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:.15;}
}
.idle-blink{animation:blink 1s steps(1) infinite;}
.idle-blink-b{animation:blink 1s steps(1) infinite .3s;}

@keyframes pulse{
  0%,100%{opacity:.45; transform:scale(1);}
  50%{opacity:1; transform:scale(1.06);}
}
.idle-pulse{animation:pulse 2.1s ease-in-out infinite; transform-origin:center;}

@keyframes twinkle{
  0%,100%{opacity:0; transform:scale(.4);}
  50%{opacity:1; transform:scale(1);}
}
.idle-twinkle{animation:twinkle 1.6s ease-in-out infinite;}

@keyframes growUp{
  from{transform:scaleY(0); opacity:0;}
  to{transform:scaleY(1); opacity:1;}
}
.grow-up{animation:growUp .8s cubic-bezier(.2,.8,.25,1) both; transform-origin:center bottom;}

@keyframes fillBar{
  from{transform:scaleX(0);}
  to{transform:scaleX(1);}
}
.fill-bar{animation:fillBar 1.4s cubic-bezier(.2,.7,.2,1) .5s both; transform-origin:left center;}

@keyframes dashDrift{
  to{stroke-dashoffset:-24;}
}
.idle-drift{animation:dashDrift 1.8s linear infinite;}

@media (prefers-reduced-motion: reduce){
  .enter,.idle-bob,.idle-bob-slow,.idle-shock,.idle-scan,.idle-swing,.idle-swing-door,
  .idle-tilt,.idle-shake,.idle-tick,.idle-flicker,.idle-blink,.idle-blink-b,.idle-pulse,
  .idle-twinkle,.grow-up,.fill-bar,.idle-drift{animation:none !important;}
  .slide.active .eyebrow,.slide.active .title,.slide.active .sub,.slide.active .scene,.slide.active .takeaway{animation:none !important;}
}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:10px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
h1.title{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:clamp(30px,5.4vw,74px);
  line-height:1.05;
  margin:0 0 14px 0;
  max-width:18ch;
}
.sub{
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:clamp(16px,2.2vw,24px);
  line-height:1.4;
  color:var(--muted);
  margin:0;
  max-width:32ch;
}
.scene{
  margin:clamp(14px,3vh,28px) 0;
  height:clamp(140px, 32vh, 320px);
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:6vw;
}
.scene svg{height:100%; max-width:92vw; overflow:visible;}
.takeaway{
  margin-top:26px;
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(17px,2vw,26px);
  color:var(--ink);
  border-top:1px solid var(--line);
  padding-top:18px;
  max-width:34ch;
}
.stamp{
  position:fixed;
  bottom:calc(22px + env(safe-area-inset-bottom));
  left:calc(24px + env(safe-area-inset-left));
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.08em;
  color:var(--muted);
  border:1px solid var(--line);
  padding:6px 10px;
  border-radius:3px;
  transform:rotate(-2deg);
  opacity:.85;
  z-index:20;
  background:rgba(20,22,29,0.6);
  backdrop-filter:blur(4px);
}
.progress{
  position:fixed;
  top:0; left:0; right:0;
  height:3px;
  background:transparent;
  z-index:30;
}
.progress-bar{
  height:100%;
  background:var(--ink);
  width:0%;
  transition:width .4s ease;
}
.nav{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom));
  right:calc(24px + env(safe-area-inset-right));
  display:flex;
  gap:10px;
  z-index:30;
}
.nav button{
  width:48px;height:48px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  font-size:20px;
  cursor:pointer;
  transition:.2s;
  touch-action:manipulation;
}
.nav button:hover{background:var(--panel2); border-color:var(--ink);}
.nav button:active{transform:scale(.92);}
.nav button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
.counter{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top));
  right:calc(24px + env(safe-area-inset-right));
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  z-index:30;
  background:rgba(20,22,29,0.5);
  padding:4px 8px;
  border-radius:10px;
  backdrop-filter:blur(4px);
}
.fs-btn{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:20px;
  cursor:pointer;
  z-index:30;
  touch-action:manipulation;
  min-height:40px;
}
.fs-btn:hover{color:var(--ink); border-color:var(--ink);}
.poll{
  display:flex;
  gap:16px;
  margin-top:24px;
  flex-wrap:wrap;
  justify-content:center;
}
.poll button{
  font-family:'Inter',sans-serif;
  font-size:15px;
  font-weight:600;
  padding:14px 22px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--ink);
  cursor:pointer;
  transition:.2s;
  min-width:160px;
}
.poll button:hover{border-color:var(--ink);}
.poll button.voted{border-color:var(--ink); background:rgba(242,183,5,0.08);}
.poll-bar{
  height:8px;border-radius:4px;background:var(--line);
  margin-top:8px;overflow:hidden;
}
.poll-bar-fill{height:100%;background:var(--ink);width:0%;transition:width .5s ease;}
.poll-result{font-size:12px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;}
kbd{
  font-family:'JetBrains Mono',monospace;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:4px;
  padding:1px 6px;
  font-size:12px;
}
.hint{
  position:fixed;
  bottom:calc(22px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
  z-index:25;
  white-space:nowrap;
  pointer-events:none;
}

/* ---------- Phones (portrait) ---------- */
@media (max-width:600px){
  .eyebrow{font-size:11px; margin-bottom:12px;}
  .title{font-size:clamp(24px,7vw,38px)!important;}
  .takeaway{font-size:clamp(15px,4vw,20px); margin-top:16px; padding-top:14px;}
  .scene{height:clamp(120px,26vh,220px); margin:14px 0;}
  .stamp{display:none;}
  .hint{display:none;}
  .counter{font-size:10px; padding:3px 7px;}
  .fs-btn{display:none;}
  .nav button{width:52px;height:52px;font-size:22px;}
}

/* ---------- Tablets / iPads (portrait & landscape) ---------- */
@media (min-width:601px) and (max-width:1180px){
  .scene{height:clamp(160px,30vh,280px);}
}

/* ---------- Short / landscape phones (limited height) ---------- */
@media (max-height:480px) and (orientation:landscape){
  .slide{padding-top:8px; padding-bottom:8px;}
  .eyebrow{margin-bottom:6px;}
  .title{font-size:clamp(20px,4.5vw,32px)!important; margin-bottom:6px;}
  .scene{height:clamp(90px,44vh,160px); margin:8px 0;}
  .takeaway{margin-top:8px; padding-top:8px; font-size:clamp(13px,2.2vw,18px);}
  .stamp,.hint{display:none;}
  .counter,.fs-btn{padding:5px 10px; font-size:10px; min-height:0;}
  .nav button{width:38px;height:38px;font-size:16px;}
}

/* ---------- Large displays / smart boards / projectors ---------- */
@media (min-width:1600px){
  .title{font-size:clamp(40px,4.6vw,96px)!important;}
  .scene{height:clamp(220px,36vh,420px);}
  .takeaway{font-size:clamp(22px,1.8vw,32px);}
  .nav button{width:56px;height:56px;font-size:24px;}
}

/* ---------- Coarse pointer (touch) devices: bigger hit areas ---------- */
@media (pointer:coarse){
  .nav button{width:52px;height:52px;}
  .fs-btn{padding:11px 16px;}
}
</style>
</head>

<body>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="counter" id="counter">01 / 01</div>
<button class="fs-btn" id="fsBtn">⤢ fullscreen (F)</button>
<div class="stamp" id="stamp">9 CONTRARIAN NOTIONS<br>ON LAW OF CRIMES</div>
<div class="hint">← → space to advance · click a slide anywhere · swipe on touch</div>

<div class="deck" id="deck"></div>

<div class="nav">
  <button id="prevBtn" aria-label="Previous">‹</button>
  <button id="nextBtn" aria-label="Next">›</button>
</div>

<script>
/* ---------------------------------------------------------
   STICK-FIGURE PRIMITIVES
   One consistent little cast, reused and recomposed throughout.
   Every primitive is wrapped in two animation layers:
     "enter"  - a one-shot pop-in when the slide becomes active
     "idle-*" - a continuous ambient loop (breathing, scanning,
                swinging, ticking...) so the whole stage feels alive,
                not just a static illustration.
--------------------------------------------------------- */
function wrapAnim(inner, opts){
  opts = opts || {};
  const delay = opts.delay || 0;
  const idle = opts.idle === undefined ? 'idle-bob' : opts.idle;
  const idleDelay = delay + 0.55;
  if(!idle){
    return '<g class="enter" style="animation-delay:' + delay + 's">' + inner + '</g>';
  }
  return '<g class="enter" style="animation-delay:' + delay + 's"><g class="' + idle + '" style="animation-delay:' + idleDelay + 's">' + inner + '</g></g>';
}

function stick(x,y,scale,o){
  o = Object.assign({
    armL:[-14,10], armR:[14,10], legL:[-10,30], legR:[10,30],
    color:'var(--ink)', head:true, delay:0, idle:'idle-bob'
  }, o||{});
  const c = o.color;
  const body = (o.head? `<circle cx="0" cy="-34" r="9" fill="${c}" stroke="none"/>`:'') + `
    <line x1="0" y1="-25" x2="0" y2="10"/>
    <line x1="0" y1="-20" x2="${o.armL[0]}" y2="${o.armL[1]}"/>
    <line x1="0" y1="-20" x2="${o.armR[0]}" y2="${o.armR[1]}"/>
    <line x1="0" y1="10" x2="${o.legL[0]}" y2="${o.legL[1]}"/>
    <line x1="0" y1="10" x2="${o.legR[0]}" y2="${o.legR[1]}"/>
    ${o.extra||''}`;
  return `<g transform="translate(${x},${y}) scale(${scale})" stroke="${c}" fill="none" stroke-width="4" stroke-linecap="round">${wrapAnim(body,{delay:o.delay, idle:o.idle})}</g>`;
}
function label(x,y,text,color,delay){
  color = color || 'var(--muted)';
  delay = delay || 0;
  return `<g class="enter" style="animation-delay:${delay}s"><text x="${x}" y="${y}" fill="${color}" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" letter-spacing="1">${text}</text></g>`;
}
function phoneIcon(x,y,s,dashed,color,o){
  s = s || 1; color = color || 'var(--ink)'; o = o || {};
  const delay = o.delay||0;
  const idle = o.idle!==undefined ? o.idle : (dashed? 'idle-pulse' : null);
  const body = `<rect x="-9" y="-16" width="18" height="32" rx="4" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${dashed?'4 4':'0'}" class="${dashed?'idle-drift':''}"/>
    <line x1="-9" y1="10" x2="9" y2="10" stroke="${color}" stroke-width="3"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">${wrapAnim(body,{delay, idle})}</g>`;
}
function cctv(x,y,o){
  o = o || {};
  const delay = o.delay||0;
  const body = `<rect x="-16" y="-6" width="26" height="14" rx="3"/>
    <circle cx="14" cy="1" r="5" fill="var(--ink)" stroke="none" class="idle-blink"/>
    <line x1="-16" y1="-6" x2="-24" y2="-16"/>`;
  return `<g transform="translate(${x},${y})" stroke="var(--ink)" fill="none" stroke-width="3" stroke-linecap="round">${wrapAnim(body,{delay, idle:'idle-scan'})}</g>`;
}
function gavelProp(x,y,o){
  o = o || {};
  const delay = o.delay||0;
  const body = `<line x1="0" y1="0" x2="22" y2="0"/><rect x="20" y="-8" width="16" height="16" rx="2" fill="var(--ink)" stroke="none"/>`;
  return `<g transform="translate(${x},${y}) rotate(-25)" stroke="var(--ink)" stroke-width="4" stroke-linecap="round">${wrapAnim(body,{delay, idle:'idle-swing'})}</g>`;
}
function barsProp(x,y,w,h,o){
  w = w||90; h = h||110; o = o || {};
  const delay = o.delay||0;
  let bars='';
  for(let i=0;i<=6;i++){bars+=`<line x1="${x-w/2+i*w/6}" y1="${y-h/2}" x2="${x-w/2+i*w/6}" y2="${y+h/2}" stroke="var(--muted)" stroke-width="4"/>`;}
  return wrapAnim(bars, {delay, idle:'idle-flicker'});
}
function clockProp(x,y,r,melt,o){
  r = r||26; o = o || {};
  const delay = o.delay||0;
  const face = `<circle cx="0" cy="0" r="${r}" fill="none" stroke="var(--ink)" stroke-width="3" ${melt?'stroke-dasharray="3 4" class="idle-flicker"':''}/>
    <line x1="0" y1="0" x2="${r-14}" y2="6" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
  const hand = `<g class="idle-tick" style="animation-delay:${delay+0.6}s"><line x1="0" y1="0" x2="0" y2="${-r+8}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>`;
  return `<g transform="translate(${x},${y})">${wrapAnim(face+hand,{delay, idle:null})}</g>`;
}
function chipHead(x,y,o){
  o = o || {};
  const delay = o.delay||0;
  const body = `<rect x="-9" y="-9" width="18" height="18" rx="3"/>
    <line x1="-9" y1="-4" x2="-14" y2="-4" class="idle-blink"/><line x1="-9" y1="4" x2="-14" y2="4" class="idle-blink-b"/>
    <line x1="9" y1="-4" x2="14" y2="-4" class="idle-blink-b"/><line x1="9" y1="4" x2="14" y2="4" class="idle-blink"/>`;
  return `<g transform="translate(${x},${y})" stroke="var(--ink)" stroke-width="2.5" fill="none">${wrapAnim(body,{delay, idle:null})}</g>`;
}
function scalesProp(x,y,o){
  o = o || {};
  const delay = o.delay||0;
  const body = `<line x1="0" y1="-30" x2="0" y2="10"/>
    <line x1="-32" y1="-18" x2="32" y2="-18"/>
    <line x1="-32" y1="-18" x2="-32" y2="0"/><line x1="32" y1="-18" x2="32" y2="0"/>
    <path d="M -44 0 A 14 10 0 0 0 -20 0 Z"/>
    <path d="M 20 0 A 14 10 0 0 0 44 0 Z"/>`;
  return `<g transform="translate(${x},${y})" stroke="var(--ink)" fill="none" stroke-width="3" stroke-linecap="round">${wrapAnim(body,{delay, idle:'idle-tilt'})}</g>`;
}
function doorShape(x,y,color,o){
  color = color || 'var(--ink)'; o = o || {};
  const delay = o.delay||0;
  const body = `<rect x="-24" y="-52" width="48" height="104" rx="3" fill="none" stroke="${color}" stroke-width="3"/><circle cx="14" cy="0" r="2.5" fill="${color}"/>`;
  return `<g transform="translate(${x},${y})">${wrapAnim(body,{delay, idle:'idle-swing-door'})}</g>`;
}
function bookStack(x,y,n,growing,o){
  n = n||3; o = o || {};
  const baseDelay = o.delay||0;
  let s='';
  for(let i=0;i<n;i++){
    const w = growing? 40+i*22 : 60;
    const d = baseDelay + i*0.12;
    const originY = y - i*10 + 9;
    s+=`<g class="grow-up" style="animation-delay:${d}s; transform-origin:${x}px ${originY}px;"><rect x="${x-w/2}" y="${y-i*10}" width="${w}" height="9" rx="2" fill="none" stroke="var(--ink)" stroke-width="2.5"/></g>`;
  }
  return s;
}
function chainBreak(x,y,o){
  o = o || {};
  const delay = o.delay||0;
  const body = `<ellipse cx="-16" cy="0" rx="12" ry="8" transform="rotate(20 -16 0)"/>
    <ellipse cx="16" cy="0" rx="12" ry="8" transform="rotate(-20 16 0)"/>`;
  return `<g transform="translate(${x},${y})" stroke="var(--ink)" stroke-width="4" fill="none">${wrapAnim(body,{delay, idle:'idle-shake'})}</g>`;
}
function pillar(x,y,h,label_,delay){
  delay = delay || 0;
  const rect = `<g class="grow-up" style="animation-delay:${delay}s; transform-origin:${x}px ${y}px;">
    <rect x="${x-14}" y="${y-h}" width="28" height="${h}" fill="none" stroke="var(--ink)" stroke-width="3"/>
  </g>`;
  if(label_.indexOf('|') !== -1){
    const parts = label_.split('|');
    const cap = `<g class="enter" style="animation-delay:${delay+0.55}s"><text x="${x}" y="${y+20}" fill="var(--ink)" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle" letter-spacing="0.5"><tspan x="${x}" dy="0">${parts[0]}</tspan><tspan x="${x}" dy="13">${parts[1]}</tspan></text></g>`;
    return rect + cap;
  }
  return rect + label(x,y+18,label_,'var(--ink)', delay+0.55);
}
function sparkle(x,y,delay){
  delay = delay || 0;
  return `<circle cx="${x}" cy="${y}" r="2.4" fill="var(--ink)" class="idle-twinkle" style="animation-delay:${delay}s"/>`;
}

const deck = document.getElementById('deck');

S.forEach((sdata, i)=>{
  const el = document.createElement('div');
  el.className='slide';
  el.id='s'+i;

  let inner = '';
  if(sdata.tag){
    inner += `<div class="eyebrow"><span class="dot"></span>${sdata.tag}</div>`;
  }
  if(sdata.title){
    inner += `<h1 class="title">${sdata.title}</h1>`;
  }
  if(sdata.sub){
    inner += `<p class="sub">${sdata.sub}</p>`;
  }
  if(sdata.visual){
    inner += `<div class="scene">${scenes[sdata.visual]||''}</div>`;
  }
  if(sdata.takeaway){
    inner += `<p class="takeaway">${sdata.takeaway}</p>`;
  }
  el.innerHTML = inner;
  deck.appendChild(el);
});

let idx = 0;
function render(){
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  document.getElementById('s'+idx).classList.add('active');
  document.getElementById('counter').textContent = String(idx+1).padStart(2,'0') + ' / ' + String(S.length).padStart(2,'0');
  document.getElementById('progressBar').style.width = ((idx+1)/S.length*100)+'%';
}

/* ---------------------------------------------------------
   REMOTE CONTROL SYNC
   This deck no longer advances itself. Every next()/prev()
   just asks the server to change the room's slide index; the
   server broadcasts the new index back to this page (and to
   any connected remote-control pages), and only THEN do we
   render. That keeps every open viewer/remote in lock-step,
   whether the move was triggered here, by a remote, or by a
   second copy of this page open elsewhere.
--------------------------------------------------------- */
const ROOM = new URLSearchParams(location.search).get('room') || 'main';
let ws;
let wsReady = false;

function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws?room=' + encodeURIComponent(ROOM));
  ws.onopen = () => {
    wsReady = true;
    ws.send(JSON.stringify({type:'total', total:S.length}));
  };
  ws.onmessage = (ev) => {
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if(msg.type === 'state' && typeof msg.idx === 'number'){
      idx = Math.min(Math.max(msg.idx,0), S.length-1);
      render();
    }
  };
  ws.onclose = () => {
    wsReady = false;
    setTimeout(connectWS, 1500); // auto-reconnect if the connection drops
  };
  ws.onerror = () => { ws.close(); };
}
connectWS();

function send(type){ if(wsReady) ws.send(JSON.stringify({type})); }
function next(){ send('next'); }
function prev(){ send('prev'); }

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
deck.addEventListener('click', (e)=>{
  if(swipeHandled){ swipeHandled=false; return; }
  const w = window.innerWidth;
  if(e.clientX > w/2) next(); else prev();
});

/* Swipe support for phones, tablets, and touch-enabled smart boards */
let touchStartX=0, touchStartY=0, touchStartTime=0, swipeHandled=false;
deck.addEventListener('touchstart', (e)=>{
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchStartTime = Date.now();
  swipeHandled = false;
}, {passive:true});
deck.addEventListener('touchend', (e)=>{
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  if(Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 600){
    swipeHandled = true;
    if(dx < 0){ next(); } else { prev(); }
  }
}, {passive:true});

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ') { e.preventDefault(); next(); }
  if(e.key==='ArrowLeft') prev();
  if(e.key.toLowerCase()==='f') toggleFullscreen();
});

/* Fullscreen toggle — handy for projectors and interactive smart boards */
function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen && el.requestFullscreen().catch(()=>{})) ||
    (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
  } else {
    (document.exitFullscreen && document.exitFullscreen()) ||
    (document.webkitExitFullscreen && document.webkitExitFullscreen());
  }
}
const fsBtnEl = document.getElementById('fsBtn');
if(fsBtnEl){ fsBtnEl.addEventListener('click', toggleFullscreen); }

  if(isIOS && fsBtnEl){ fsBtnEl.style.display='none'; }
})();

render();
</script>
