<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Slide Remote</title>
<style>
  :root{
    --bg:#000; --panel:#111; --panel2:#1a1a1a; --ink:#fff; --muted:#8a8a8a; --line:rgba(255,255,255,.16);
    --accent:#f2b705;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    min-height:100dvh; padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; overscroll-behavior:none;
  }
  .top{width:100%; max-width:480px; text-align:center;}
  h1{font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 4px;}
  .room{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .status{display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;background:#c0392b;transition:.2s;}
  .dot.on{background:#2ecc71;}
  .counter{font-family:'JetBrains Mono',monospace; font-size:20px; margin-top:18px; letter-spacing:.05em;}

  .pad{
    width:100%; max-width:480px; flex:1; display:flex; flex-direction:column; gap:16px;
    justify-content:center; padding:20px 0;
  }
  .bigbtn{
    flex:1; min-height:120px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:20px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; user-select:none; transition:.15s;
  }
  .bigbtn:active{transform:scale(.97); background:var(--panel2); border-color:var(--ink);}
  .bigbtn .arrow{font-size:38px; line-height:1;}
  .row{display:flex; gap:16px;}
  .row .bigbtn{min-height:100px;}

  .bottom{width:100%; max-width:480px; display:flex; flex-direction:column; gap:10px;}
  .jump{display:flex; gap:8px;}
  .jump input{
    flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px; font-family:'JetBrains Mono',monospace; font-size:14px; text-align:center;
  }
  .jump button{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px 18px; font-weight:600; cursor:pointer;
  }
  .hint{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); text-align:center;}
  a{color:var(--muted);}
</style>
</head>
<body>

<div class="top">
  <h1>Slide Remote</h1>
  <div class="room">room: <span id="roomLabel"></span></div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
  <div class="counter" id="counter">-- / --</div>
</div>

<div class="pad">
  <div class="bigbtn" id="prevBtn"><span class="arrow">‹</span><span>PREVIOUS</span></div>
  <div class="bigbtn" id="nextBtn"><span class="arrow">›</span><span>NEXT</span></div>
</div>

<div class="bottom">
  <div class="jump">
    <input id="jumpInput" type="number" min="1" placeholder="Jump to slide #">
    <button id="jumpBtn">Go</button>
  </div>
  <div class="hint">← → or space also work on a keyboard. Give the presentation link (present.html) to your audience and keep this remote for yourself.</div>
</div>

<script>
const ROOM = new URLSearchParams(location.search).get('room') || 'main';
document.getElementById('roomLabel').textContent = ROOM;

let idx = 0, total = 0, ws, wsReady = false;
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const counter = document.getElementById('counter');

function setStatus(on, text){
  dot.classList.toggle('on', on);
  statusText.textContent = text;
}

function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws?room=' + encodeURIComponent(ROOM));
  ws.onopen = () => { wsReady = true; setStatus(true, 'connected'); };
  ws.onmessage = (ev) => {
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if(msg.type === 'state'){
      idx = msg.idx; total = msg.total || total;
      counter.textContent = (total ? String(idx+1).padStart(2,'0') : String(idx+1)) + ' / ' + (total ? String(total).padStart(2,'0') : '?');
    }
  };
  ws.onclose = () => { wsReady = false; setStatus(false, 'reconnecting…'); setTimeout(connectWS, 1500); };
  ws.onerror = () => { ws.close(); };
}
connectWS();

function send(type, extra){ if(wsReady) ws.send(JSON.stringify(Object.assign({type}, extra||{}))); }

document.getElementById('nextBtn').addEventListener('click', () => send('next'));
document.getElementById('prevBtn').addEventListener('click', () => send('prev'));
document.getElementById('jumpBtn').addEventListener('click', () => {
  const v = parseInt(document.getElementById('jumpInput').value, 10);
  if(!isNaN(v) && v >= 1){ send('goto', {idx: v-1}); document.getElementById('jumpInput').value=''; }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); send('next'); }
  if(e.key === 'ArrowLeft'){ send('prev'); }
});
</script>
</body>
</html>
